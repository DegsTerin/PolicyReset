name: PolicyReset CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python syntax
        shell: pwsh
        run: python -m py_compile PolicyReset.pyw

      - name: Run test suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Validate project assets
        shell: pwsh
        run: |
          if (-not (Test-Path -Path README.md)) {
              throw "README.md is missing."
          }

          if (-not (Test-Path -Path assets/demo.gif)) {
              throw "assets/demo.gif is missing."
          }

          $gif = Get-Item -Path assets/demo.gif
          if ($gif.Length -le 0) {
              throw "assets/demo.gif is empty."
          }
