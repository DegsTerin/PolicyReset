name: Prepare PolicyReset demonstration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install GIF tooling
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Generate demonstration GIF
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/demo-source.txt

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          source = Path("assets/demo-source.txt").read_text(encoding="utf-8")
          raw_frames = [frame.strip("\n") for frame in source.split("FRAME") if frame.strip()]

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
          if not Path(font_path).exists():
              raise SystemExit("A monospace font could not be found.")

          font = ImageFont.truetype(font_path, 18)
          width, height = 1200, 680
          margin_x, margin_y = 28, 28
          line_height = 23

          def wrap(text, limit=104):
              result = []
              for line in text.splitlines():
                  while len(line) > limit:
                      result.append(line[:limit])
                      line = line[limit:]
                  result.append(line)
              return result

          frames = []
          for index, text in enumerate(raw_frames, start=1):
              image = Image.new("RGB", (width, height), "#0b0f14")
              draw = ImageDraw.Draw(image)
              draw.rectangle((12, 12, width - 12, height - 12), outline="#354052", width=2)
              draw.text(
                  (margin_x, margin_y),
                  f"PolicyReset 4.2.4 | Demonstration {index}/{len(raw_frames)}",
                  font=font,
                  fill="#7ee787",
              )
              y = margin_y + 35
              for line in wrap(text):
                  if y > height - margin_y:
                      break
                  draw.text((margin_x, y), line, font=font, fill="#e6edf3")
                  y += line_height
              frames.append(image)

          if len(frames) < 2:
              raise SystemExit("The demonstration needs at least two frames.")

          output = Path("assets/demo.gif")
          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=2200,
              loop=0,
              disposal=2,
          )
          print(f"Generated {output} with {len(frames)} frames.")
          PY

      - name: Remove temporary publication payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload
          rm -f assets/demo-source.txt

      - name: Commit demonstration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Add PolicyReset demonstration GIF [skip ci]" || exit 0
          git push
