name: Assemble PolicyReset release assets

on:
  push:
    branches: [main]

concurrency:
  group: policyreset-assembly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          count=$(find payload -maxdepth 1 -type f -name 'release.tar.gz.b64.part*' 2>/dev/null | wc -l)
          echo "count=$count"

          if [ "$count" -ne 11 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          complete=true
          for i in $(seq -w 1 11); do
            test -f "payload/release.tar.gz.b64.part${i}" || complete=false
          done

          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Assemble and validate release
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          for i in $(seq -w 1 11); do cat "payload/release.tar.gz.b64.part${i}"; done > work/release.tar.gz.b64
          base64 --decode work/release.tar.gz.b64 > work/release.tar.gz
          tar -xzf work/release.tar.gz -C .

          python -m py_compile PolicyReset.pyw
          python -m unittest discover -s tests -v
          test -s assets/demo.gif

          rm -rf payload work

      - name: Commit assembled release
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PolicyReset.pyw tests/test_source.py assets/demo.gif
          git commit -m "Assemble PolicyReset 4.2.4 release [skip ci]"
          git push
