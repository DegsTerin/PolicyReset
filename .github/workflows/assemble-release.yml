name: Assemble PolicyReset release assets

on:
  push:
    branches: [main]

concurrency:
  group: policyreset-assembly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          code_count=$(find payload -maxdepth 1 -type f -name 'PolicyReset.pyw.part*' 2>/dev/null | wc -l)
          test_count=$(find payload -maxdepth 1 -type f -name 'test_source.py.part*' 2>/dev/null | wc -l)
          gif_count=$(find payload -maxdepth 1 -type f -name 'demo.gif.b64.part*' 2>/dev/null | wc -l)

          echo "code_count=$code_count"
          echo "test_count=$test_count"
          echo "gif_count=$gif_count"

          if [ "$code_count" -ne 7 ] || [ "$test_count" -ne 2 ] || [ "$gif_count" -ne 8 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          complete=true

          for i in $(seq -w 1 7); do
            test -f "payload/PolicyReset.pyw.part${i}" || complete=false
          done

          for i in $(seq -w 1 2); do
            test -f "payload/test_source.py.part${i}" || complete=false
          done

          for i in $(seq -w 1 8); do
            test -f "payload/demo.gif.b64.part${i}" || complete=false
          done

          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Assemble release files
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets tests

          for i in $(seq -w 1 7); do cat "payload/PolicyReset.pyw.part${i}"; done > PolicyReset.pyw
          for i in $(seq -w 1 2); do cat "payload/test_source.py.part${i}"; done > tests/test_source.py
          for i in $(seq -w 1 8); do cat "payload/demo.gif.b64.part${i}"; done | base64 --decode > assets/demo.gif

          python -m py_compile PolicyReset.pyw
          python -m unittest discover -s tests -v

          rm -rf payload

      - name: Commit assembled release
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PolicyReset.pyw tests/test_source.py assets/demo.gif
          git commit -m "Assemble PolicyReset 4.2.4 release [skip ci]"
          git push
