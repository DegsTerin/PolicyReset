name: PolicyReset compile diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Capture compiler diagnostics
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path
          import platform
          import sys
          import traceback
          import py_compile

          report = [
              f"Python: {sys.version}",
              f"Platform: {platform.platform()}",
          ]

          try:
              py_compile.compile("PolicyReset.pyw", doraise=True)
              report.append("Compile: OK")
          except BaseException:
              report.append("Compile: FAILED")
              report.append(traceback.format_exc())

          Path("ci-compile-debug.txt").write_text(
              "\n".join(report),
              encoding="utf-8",
          )
          '@

          Set-Content -Path debug_compile.py -Value $script -Encoding utf8
          python debug_compile.py

      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ci-compile-debug.txt
          git commit -m "Capture PolicyReset compiler diagnostics [skip ci]"
          git push
